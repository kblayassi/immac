<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Correction des évaluations</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../parcours/app.css">
<link rel="stylesheet" href="eval.css">
</head>
<body>

<header class="barre">
  <div class="barre-interieur">
    <span class="marque" aria-hidden="true"><span class="logo">&gt;_</span></span>
    <div class="barre-titre">Correction</div>
    <span class="barre-espace"></span>
    <span id="avancement" class="avancement" hidden></span>
    <span id="compte" class="compte"></span>
  </div>
</header>

<main class="page large">

  <!-- Cette page ne contient aucun barème : elle attend qu'on lui en donne un.
       C'est pourquoi elle peut être publiée avec le reste du site sans rien
       livrer des attentes d'une évaluation. -->
  <div class="depot-double">
    <div>
      <p class="etat-bareme" id="etat-bareme">Aucun barème chargé</p>
      <p class="discret">Dépose le barème <code>.json</code> et les copies des élèves
         — ensemble ou l'un après l'autre, par paquets.</p>
    </div>
    <input type="file" id="champ-fichiers" class="hors-vue" accept="application/json,.json" multiple>
    <label class="depot" id="zone-depot" for="champ-fichiers">
      <span class="depot-icone" aria-hidden="true">&#11015;</span>
      <span class="depot-titre">Dépose ici les fichiers <code>.json</code></span>
      <span class="depot-sous">ou <u>clique pour parcourir</u></span>
    </label>
  </div>

  <div class="barre-outils" id="barre-outils" hidden>
    <button class="bouton" id="btn-csv" type="button">Exporter les notes (CSV)</button>
    <button class="bouton" id="btn-copies" type="button">Exporter les copies corrigées (ZIP)</button>
    <button class="bouton fantome" id="btn-vider" type="button">Vider la table</button>
  </div>

  <p id="vide" class="discret vide">
    Rien à corriger pour l'instant. Les copies restent dans ce navigateur :
    elles ne sont envoyées nulle part.
  </p>

  <div id="table"></div>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="correction.js"></script>
</body>
</html>

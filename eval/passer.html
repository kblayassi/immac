<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passer une évaluation</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../parcours/app.css">
<link rel="stylesheet" href="eval.css">
</head>
<body>

<!-- Une seule page pour toutes les évaluations : c'est le code entré par l'élève
     qui désigne le sujet. La barre ne propose ni retour au site, ni progression,
     ni accueil — pendant l'épreuve, il n'y a qu'un seul endroit où aller. -->
<header class="barre">
  <div class="barre-interieur">
    <span class="marque" aria-hidden="true"><span class="logo">&gt;_</span></span>

    <div class="barre-titre" id="barre-titre"></div>

    <span class="barre-espace"></span>

    <span id="identite-barre"></span>

    <div id="cadre-chrono" hidden>
      <span aria-hidden="true">⏳</span>
      <span id="chrono" role="timer" aria-label="Temps restant">--:--</span>
    </div>

    <button class="bouton" id="btn-rendre" hidden>Rendre</button>
  </div>
</header>

<main id="vue" class="page" tabindex="-1"></main>

<!-- Fenêtre de remise : sans bouton de fermeture, et la touche Échap y est
     refusée. Ouverte en modal, elle rend tout le reste de la page inerte. -->
<dialog class="panneau" id="panneau-remise">
  <div class="corps">
    <h2 id="remise-titre">Temps écoulé</h2>
    <div id="remise-texte"></div>
  </div>
  <div class="pied">
    <button class="bouton" id="btn-retelecharger">Télécharger à nouveau</button>
    <button class="bouton fantome" id="btn-quitter">Quitter l'évaluation</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="eleve.js"></script>
</body>
</html>

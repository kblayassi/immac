<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 235" width="760" height="235" font-family="Quicksand, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><title>Un paquet : en-tête avec les adresses IP, le TTL et le numéro, puis les données</title><rect width="760" height="235" rx="16" fill="#ffffff"/><text x="380" y="34" font-size="17" fill="#573D91" font-weight="700" text-anchor="middle">Un paquet qui voyage sur Internet</text><rect x="30" y="60" width="200" height="70" rx="10" fill="#573D91"/><rect x="210" y="60" width="20" height="70" fill="#573D91"/><text x="130" y="90" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">Adresses IP</text><text x="130" y="112" font-size="12" fill="#fff" font-weight="500" text-anchor="middle">expéditeur → destinataire</text><rect x="230" y="60" width="70" height="70" fill="#7E64B5"/><text x="265" y="90" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">TTL</text><text x="265" y="112" font-size="12" fill="#fff" font-weight="500" text-anchor="middle">64</text><rect x="300" y="60" width="150" height="70" fill="#E67E22"/><text x="375" y="90" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">Numéro</text><text x="375" y="112" font-size="12" fill="#fff" font-weight="500" text-anchor="middle">segment n°3 sur 8</text><rect x="450" y="60" width="280" height="70" rx="10" fill="#5b8def"/><rect x="450" y="60" width="20" height="70" fill="#5b8def"/><text x="590" y="90" font-size="15" fill="#fff" font-weight="700" text-anchor="middle">Données</text><text x="590" y="112" font-size="12" fill="#fff" font-weight="500" text-anchor="middle">un petit morceau du fichier</text><text x="165" y="160" font-size="13" fill="#573D91" font-weight="700" text-anchor="middle">écrit grâce à IP</text><text x="165" y="178" font-size="12" fill="#8a8799" font-weight="500" text-anchor="middle">pour trouver le chemin</text><text x="375" y="160" font-size="13" fill="#E67E22" font-weight="700" text-anchor="middle">écrit grâce à TCP</text><text x="375" y="178" font-size="12" fill="#8a8799" font-weight="500" text-anchor="middle">pour remettre en ordre</text><text x="590" y="160" font-size="13" fill="#5b8def" font-weight="700" text-anchor="middle">ce que l'on veut envoyer</text><text x="590" y="178" font-size="12" fill="#8a8799" font-weight="500" text-anchor="middle">texte, image, son, vidéo…</text><text x="380" y="212" font-size="13" fill="#1d1a26" font-weight="500" text-anchor="middle">Comme une carte postale numérotée : l'adresse au dos, le numéro de la carte, et le message.</text></svg>
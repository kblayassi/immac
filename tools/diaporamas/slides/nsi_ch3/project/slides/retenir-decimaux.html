<section id="retenir-decimaux" data-transition="fade" style="background:#E8F6F8; color:#221A33; font-family:'Quicksand', Arial, sans-serif; padding:128px; display:flex; flex-direction:column; justify-content:center; gap:40px"><div style="display:flex; flex-direction:row; align-items:center; gap:16px"><x-icon name="Star" style="color:#0097A7; width:48px; height:48px"></x-icon><p style="font-size:30px; font-weight:700; color:#00727E; letter-spacing:3px; text-transform:uppercase">À retenir</p></div><h2 style="font-size:60px; font-weight:700; line-height:1.2; color:#221A33">Certains décimaux ont une écriture binaire finie, <span style="color:#573D91">d’autres ne peuvent pas être représentés exactement</span>.</h2><ul style="font-size:38px; line-height:1.45; color:#3E3650"><li>Écriture finie : <b>0,25</b> ou <b>0,75</b>.</li><li>Pas d'écriture finie : <b>0,1</b> ou <b>1/3</b>.</li><li>Cela entraîne des <b>erreurs d'approximation</b> en machine.</li></ul></section>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Quicksand, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><title>Comment consomme-t-on illégalement des films, séries ou musiques ?</title><rect width="760" height="380" rx="16" fill="#ffffff"/><text x="380" y="28" font-size="16" fill="#573D91" font-weight="700" text-anchor="middle">Comment consomme-t-on illégalement des films, séries ou musiques ?</text><text x="380" y="48" font-size="12" fill="#8a8799" font-weight="500" text-anchor="middle">part des consommateurs illégaux utilisant chaque moyen (plusieurs réponses possibles)</text><text x="300" y="87" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="end">Sites de streaming</text><rect x="312" y="72" width="338.5" height="20" rx="4" fill="#c62828"/><text x="656.5454545454545" y="87" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="start">49 %</text><text x="300" y="117" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="end">Téléchargement direct</text><rect x="312" y="102" width="262.5" height="20" rx="4" fill="#c62828"/><text x="580.5454545454545" y="117" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="start">38 %</text><text x="300" y="147" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="end">Réseaux sociaux</text><rect x="312" y="132" width="221.1" height="20" rx="4" fill="#c62828"/><text x="539.0909090909091" y="147" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="start">32 %</text><text x="300" y="177" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="end">Pair-à-pair (torrent)</text><rect x="312" y="162" width="179.6" height="20" rx="4" fill="#c62828"/><text x="497.6363636363636" y="177" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="start">26 %</text><text x="300" y="207" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="end">Clés USB de proches</text><rect x="312" y="192" width="158.9" height="20" rx="4" fill="#c62828"/><text x="476.9090909090909" y="207" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="start">23 %</text><text x="300" y="237" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="end">IPTV (boîtier, appli)</text><rect x="312" y="222" width="152.0" height="20" rx="4" fill="#c62828"/><text x="470.0" y="237" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="start">22 %</text><text x="300" y="267" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="end">Services de cloud</text><rect x="312" y="252" width="145.1" height="20" rx="4" fill="#c62828"/><text x="463.0909090909091" y="267" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="start">21 %</text><text x="300" y="297" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="end">Live streaming</text><rect x="312" y="282" width="76.0" height="20" rx="4" fill="#c62828"/><text x="394.0" y="297" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="start">11 %</text><text x="300" y="327" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="end">E-mails de proches</text><rect x="312" y="312" width="20.7" height="20" rx="4" fill="#c62828"/><text x="338.72727272727275" y="327" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="start">3 %</text><text x="380" y="366" font-size="11" fill="#8a8799" font-weight="500" text-anchor="middle">Source : Arcom, baromètre de la consommation des biens culturels dématérialisés, 2023.</text></svg>
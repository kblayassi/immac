<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" width="760" height="412" font-family="Quicksand, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><title>Évolution du trafic mensuel mondial de 2017 à 2022, la vidéo en représente la plus grande part</title><rect width="760" height="412" rx="16" fill="#ffffff"/><text x="380" y="30" font-size="17" fill="#573D91" font-weight="700" text-anchor="middle">Trafic mondial sur Internet, chaque mois</text><text x="380" y="52" font-size="12" fill="#8a8799" font-weight="500" text-anchor="middle">en milliards de milliards d'octets (1 Eo = 10¹⁸ octets)</text><line x1="90" y1="330.0" x2="720" y2="330.0" stroke="#e0dced" stroke-width="1"/><text x="80" y="334.0" font-size="12" fill="#8a8799" font-weight="500" text-anchor="end">0</text><line x1="90" y1="267.5" x2="720" y2="267.5" stroke="#e0dced" stroke-width="1"/><text x="80" y="271.5" font-size="12" fill="#8a8799" font-weight="500" text-anchor="end">100</text><line x1="90" y1="205.0" x2="720" y2="205.0" stroke="#e0dced" stroke-width="1"/><text x="80" y="209.0" font-size="12" fill="#8a8799" font-weight="500" text-anchor="end">200</text><line x1="90" y1="142.5" x2="720" y2="142.5" stroke="#e0dced" stroke-width="1"/><text x="80" y="146.5" font-size="12" fill="#8a8799" font-weight="500" text-anchor="end">300</text><line x1="90" y1="80.0" x2="720" y2="80.0" stroke="#e0dced" stroke-width="1"/><text x="80" y="84.0" font-size="12" fill="#8a8799" font-weight="500" text-anchor="end">400</text><rect x="120" y="253.8" width="60" height="19.1" fill="#5b8def" rx="3"/><rect x="120" y="272.8" width="60" height="57.2" fill="#573D91"/><text x="150" y="245.75" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="middle">122</text><text x="150" y="350" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="middle">2017</text><rect x="225" y="232.5" width="60" height="23.0" fill="#5b8def" rx="3"/><rect x="225" y="255.5" width="60" height="74.5" fill="#573D91"/><text x="255" y="224.5" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="middle">156</text><text x="255" y="350" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="middle">2018</text><rect x="330" y="204.4" width="60" height="27.9" fill="#5b8def" rx="3"/><rect x="330" y="232.3" width="60" height="97.7" fill="#573D91"/><text x="360" y="196.375" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="middle">201</text><text x="360" y="350" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="middle">2019</text><rect x="435" y="171.2" width="60" height="33.0" fill="#5b8def" rx="3"/><rect x="435" y="204.3" width="60" height="125.7" fill="#573D91"/><text x="465" y="163.25" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="middle">254</text><text x="465" y="350" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="middle">2020</text><rect x="540" y="130.6" width="60" height="38.7" fill="#5b8def" rx="3"/><rect x="540" y="169.3" width="60" height="160.7" fill="#573D91"/><text x="570" y="122.625" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="middle">319</text><text x="570" y="350" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="middle">2021</text><rect x="645" y="82.5" width="60" height="44.5" fill="#5b8def" rx="3"/><rect x="645" y="127.0" width="60" height="203.0" fill="#573D91"/><text x="675" y="74.5" font-size="13" fill="#1d1a26" font-weight="700" text-anchor="middle">396</text><text x="675" y="350" font-size="13" fill="#1d1a26" font-weight="600" text-anchor="middle">2022</text><rect x="250" y="362" width="14" height="14" fill="#573D91"/><text x="270" y="374" font-size="13" fill="#1d1a26" font-weight="500" text-anchor="start">vidéo</text><rect x="360" y="362" width="14" height="14" fill="#5b8def"/><text x="380" y="374" font-size="13" fill="#1d1a26" font-weight="500" text-anchor="start">Web, e-mails, jeux, fichiers…</text><text x="380" y="398" font-size="11" fill="#8a8799" font-weight="500" text-anchor="m
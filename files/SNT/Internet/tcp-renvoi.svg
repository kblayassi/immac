<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 395" width="700" height="395" font-family="Quicksand, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><title>TCP : le destinataire redemande le segment 2 qui s'est perdu</title><rect width="700" height="395" rx="16" fill="#ffffff"/><rect x="40" y="40" width="130" height="330" rx="14" fill="#efeaf9"/><text x="105" y="30" font-size="15" fill="#573D91" font-weight="700" text-anchor="middle">Expéditeur</text><rect x="530" y="40" width="130" height="330" rx="14" fill="#efeaf9"/><text x="595" y="30" font-size="15" fill="#573D91" font-weight="700" text-anchor="middle">Destinataire</text><line x1="170" y1="75" x2="530" y2="105" stroke="#5b8def" stroke-width="2.5"/><path d="M530 105 L519.5 108.4 L520.3 99.9 Z" fill="#5b8def"/><text x="260" y="73" font-size="13" fill="#5b8def" font-weight="700" text-anchor="middle">segment 1</text><line x1="170" y1="125" x2="400" y2="145" stroke="#5b8def" stroke-width="2.5"/><path d="M392 135 l18 18 M410 135 l-18 18" stroke="#c62828" stroke-width="4"/><text x="470" y="173" font-size="12" fill="#c62828" font-weight="700" text-anchor="middle">perdu en route</text><text x="260" y="123" font-size="13" fill="#5b8def" font-weight="700" text-anchor="middle">segment 2</text><line x1="170" y1="175" x2="530" y2="205" stroke="#5b8def" stroke-width="2.5"/><path d="M530 205 L519.5 208.4 L520.3 199.9 Z" fill="#5b8def"/><text x="260" y="173" font-size="13" fill="#5b8def" font-weight="700" text-anchor="middle">segment 3</text><line x1="530" y1="250" x2="170" y2="280" stroke="#E67E22" stroke-width="2.5"/><path d="M170 280 L179.7 274.9 L180.5 283.4 Z" fill="#E67E22"/><text x="350" y="246" font-size="13" fill="#E67E22" font-weight="700" text-anchor="middle">« Je n'ai pas reçu le segment 2 ! »</text><line x1="170" y1="315" x2="530" y2="345" stroke="#12855c" stroke-width="2.5"/><path d="M530 345 L519.5 348.4 L520.3 339.9 Z" fill="#12855c"/><text x="300" y="311" font-size="13" fill="#12855c" font-weight="700" text-anchor="middle">segment 2, renvoyé</text></svg>